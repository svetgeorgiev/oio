name: OIO checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional live connector
        run: python -m pip install -r backend/requirements.txt
      - name: Backend unit and HTTP tests (mock streams; no live collection)
        working-directory: backend
        run: python -m unittest discover -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: JavaScript unit tests
        working-directory: frontend
        run: node --test src/lab-utils.test.js src/research-utils.test.js src/region-utils.test.js
      - name: Production frontend build
        working-directory: frontend
        run: npm run build
